name: Nightly quality

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-quality
  cancel-in-progress: false

jobs:
  # main only moves on release, so a daily soak mostly repeats the last result.
  # Soak each new main commit once; rerun an unchanged one weekly (Sunday UTC)
  # to catch runner-image drift and intermittent failures.
  decide:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$(date -u +%u)" = 7 ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "main $GITHUB_SHA already passed nightly; skipping until it changes or Sunday"
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

  quality:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    uses: ./.github/workflows/quality.yml
    with:
      soak-seconds: 300
