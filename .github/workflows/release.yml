# Generated from the development repository's publish/overlay directory.
name: Release

# Versioned main commits request a release. Tags are created only after QA.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.existing.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        run: python -c 'import sys; sys.path.insert(0,"qa"); from package import version; print("version="+version())' >> "$GITHUB_OUTPUT"
      - id: existing
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({...context.repo, tag: `v${process.env.VERSION}`});
              core.setOutput('publish', 'false');
              core.notice('Already released; bump manifests to request another release.');
              return; // Still run QA on main; do not publish or move existing tags.
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('publish', 'true');
            }
            try {
              const tag = await github.rest.git.getRef({...context.repo, ref: `tags/v${process.env.VERSION}`});
              let object = tag.data.object;
              while (object.type === 'tag') {
                object = (await github.rest.git.getTag({...context.repo, tag_sha: object.sha})).data.object;
              }
              if (object.sha !== context.sha) throw new Error('Version tag belongs to another commit; use a new version.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (process.env.VERSION.includes('-')) {
              const versionCore = process.env.VERSION.split('-')[0];
              try {
                await github.rest.git.getRef({...context.repo, ref: `tags/v${versionCore}`});
                throw new Error('Prerelease core already has a stable tag; start a new beta cycle.');
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            try {
              const latest = (await github.rest.repos.getLatestRelease(context.repo)).data.tag_name;
              const core = value => {
                const match = value.match(/^v?([0-9]+)\.([0-9]+)(?:\.([0-9]+))?/);
                if (!match) throw new Error('Cannot compare the latest release version.');
                return match.slice(1).map(part => Number(part || 0));
              };
              const candidate = core(process.env.VERSION), stable = core(latest);
              const firstDifference = candidate.findIndex((part, index) => part !== stable[index]);
              if (firstDifference >= 0 && candidate[firstDifference] < stable[firstDifference]) {
                throw new Error('Candidate would downgrade the current stable release.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

  quality:
    needs: prepare
    uses: ./.github/workflows/quality.yml

  npm:
    needs: [prepare, quality]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: quality-receipt
      - name: Publish exactly the verified tarball (OIDC)
        run: python qa/npm_publish.py --dist dist --receipt quality.json --commit "$GITHUB_SHA" --version '${{ needs.prepare.outputs.version }}'

  publish:
    needs: [prepare, quality, npm]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: quality-receipt
      - run: python qa/verify.py --dist dist --receipt quality.json --commit "$GITHUB_SHA" --version '${{ needs.prepare.outputs.version }}'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          files: |
            dist/*.zip
            dist/*.tgz
            quality.json
