# Release for mistlib. Fires on a `v*` tag push.
#
# Generated file. Edits here are overwritten the next time sources are synced
# from the upstream development repository -- change it there instead. Tags are
# cut by the release tooling that lives alongside it.
#
# Four distribution channels:
#   1. GitHub Release  — native binaries and the wasm zip
#   2. npm             — mistlib; the primary route for bundled web apps
#   3. jsDelivr        — an npm mirror, so version-pinned CDN URLs come for free
#   4. GitHub Pages    — a direct-import URL for the latest build, and a landing page
#
# Language wrappers (Unity / Python / JS) are not shipped here. They live in
# tik-choco-lab/mistlib-examples, which cuts its own releases.
#
# One-time setup this workflow depends on:
#   * Settings > Pages > Source set to "GitHub Actions"
#   * An NPM_TOKEN automation token in Settings > Secrets and variables > Actions,
#     with permission to publish the unscoped `mistlib` package

name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Confirm the tag doesn't point at broken code before building any artifact.
  test:
    name: test (core + native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run -p mistlib-core -p mistlib-native --locked --profile ci

  wasm:
    name: build wasm
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: wasm-pack build --target web --release
        working-directory: mistlib-wasm

      # The raw pkg/ is what the npm and Pages jobs consume.
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: mistlib-wasm/pkg/
          if-no-files-found: error

      - name: Assemble archive
        run: |
          set -euo pipefail
          rm -rf staging
          mkdir -p staging/pkg
          cp -R mistlib-wasm/pkg/. staging/pkg/
          cp LICENSE README.md staging/
          # Keeps the license discoverable when pkg/ is vendored on its own.
          cp LICENSE staging/pkg/
          (cd staging && zip -qr "../mistlib-wasm-${GITHUB_REF_NAME}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: release-wasm
          path: mistlib-wasm-*.zip
          if-no-files-found: error

  native:
    name: package native (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            binary: libmistlib.so
          - os: windows-latest
            target: windows-x86_64
            binary: mistlib.dll
          - os: macos-latest
            target: macos-aarch64
            binary: libmistlib.dylib
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p mistlib-native

      # bash exists on every runner, so this stays a single step. `zip` ships with
      # Linux and macOS but not with Git Bash on Windows, where `7z` is available
      # instead -- use whichever is present.
      - name: Assemble archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging
          mkdir -p staging
          cp "target/release/${{ matrix.binary }}" staging/
          cp LICENSE README.md staging/
          out="$PWD/mistlib-native-${{ matrix.target }}-${GITHUB_REF_NAME}.zip"
          cd staging
          if command -v zip >/dev/null 2>&1; then zip -qr "$out" .; else 7z a -tzip "$out" . >/dev/null; fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-native-${{ matrix.target }}
          path: mistlib-native-*.zip
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: [wasm, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - run: ls -lh assets

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Tags like v0.6.0-rc.1 are marked prerelease so "latest release" stays put.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: assets/*.zip

  npm:
    name: publish to npm
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: pkg
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # wasm-pack copies a crate-level README into pkg/ when one exists, and
      # mistlib-wasm has none -- without this the npmjs.com page would be blank.
      # npm always includes README/LICENSE regardless of the `files` field, and
      # resolves relative links against package.json's `repository`.
      - name: Add README and license
        run: cp README.md LICENSE pkg/

      # wasm-pack writes name=mistlib-wasm and the version from Cargo.toml. Override
      # both to the published name and the tag: the release tooling already keeps
      # them in step, so this is a guard against them drifting apart.
      - name: Prepare package metadata
        working-directory: pkg
        run: |
          set -euo pipefail
          npm pkg set name="mistlib"
          npm pkg set version="${GITHUB_REF_NAME#v}"
          npm pkg set repository.type="git"
          npm pkg set repository.url="git+https://github.com/tik-choco-lab/mistlib.git"
          npm pkg set homepage="https://github.com/tik-choco-lab/mistlib"
          cat package.json

      - name: Publish
        working-directory: pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # A prerelease such as v0.6.0-rc.1 must not move the `latest` dist-tag.
          tag=latest
          case "${GITHUB_REF_NAME}" in *-*) tag=next ;; esac
          echo "dist-tag: $tag"
          # --access public is the default for an unscoped package; state it anyway.
          npm publish --access public --tag "$tag"

  pages:
    name: deploy GitHub Pages
    needs: wasm
    # Pages always reflects the latest stable release, never a prerelease.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Pages deployments cannot overlap; let an in-flight one finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: site/pkg

      # Pages only ever holds the latest release. Anyone needing a version-pinned
      # URL is pointed at jsDelivr (the npm mirror), so no versions accumulate here.
      - name: Assemble site
        run: |
          set -euo pipefail
          cp .github/pages/index.html site/index.html
          # Display uses the tag as-is (v0.6.0); npm/jsDelivr need it without the v.
          sed -i "s/__VERSION__/${GITHUB_REF_NAME}/g;   s/__NPM_VERSION__/${GITHUB_REF_NAME#v}/g" site/index.html
          ! grep -q '__VERSION__\|__NPM_VERSION__' site/index.html
          # Stop Jekyll from dropping files whose names begin with an underscore.
          touch site/.nojekyll
          ls -R site | head -40

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
