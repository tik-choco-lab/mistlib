# mistlib (公開リポジトリ) の CI。
#
# このファイルは mistlib-dev の publish/overlay/ が正。公開リポジトリ側で直接
# 編集しても次回の `just publish-sync` で上書きされる。内容は mistlib-dev の
# .github/workflows/ci.yml と同じゲート（fmt / clippy / nextest / wasm build）を
# 公開側の crates だけに適用したもの。dev 側の CI 定義を変えたらこちらも揃える。

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 警告のゲートは clippy コマンド側の `-- -D warnings` で明示する。グローバルな
# RUSTFLAGS にすると wasm ビルド（wasm-pack は clippy ではなく rustc を走らせる）が
# 既知の dead_code ベースラインで落ちる。
env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml がバージョンと components を固定している。
      - run: rustup show
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (core + native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p mistlib-core -p mistlib-native --all-targets --locked -- -D warnings
      # wasm は既知の警告ベースライン（単一スレッドのブラウザ標的における
      # arc_with_non_send_sync 誤検知が大半）を抱えている。報告はするがゲートしない。
      - name: clippy (wasm, informational)
        continue-on-error: true
        run: cargo clippy -p mistlib-wasm --target wasm32-unknown-unknown --all-targets

  test:
    name: test (core + native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # ci プロファイル (.config/nextest.toml) が実タイミング依存の WebRTC テストを
      # リトライするので、共有ランナーのタイミングゆらぎで run が赤くならない。
      - run: cargo nextest run -p mistlib-core -p mistlib-native --locked --profile ci
      # nextest は doctest を走らせないので別途実行し、静かに腐るのを防ぐ。
      - run: cargo test -p mistlib-core -p mistlib-native --doc --locked

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: wasm-pack build --target web
        working-directory: mistlib-wasm
