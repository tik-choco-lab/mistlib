# CI for mistlib.
#
# Generated file. Edits here are overwritten the next time sources are synced
# from the upstream development repository -- change it there instead.
# The gates (fmt / clippy / nextest / wasm build) mirror the ones the library is
# developed against.

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Warnings are gated on the clippy invocation itself (`-- -D warnings`) rather
# than a global RUSTFLAGS: the latter would fail the wasm build on its known
# dead_code baseline, since wasm-pack runs rustc, not clippy.
env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version and components; this materializes it.
      - run: rustup show
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (core + native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p mistlib-core -p mistlib-native --all-targets --locked -- -D warnings
      # wasm carries a known warning baseline, mostly arc_with_non_send_sync false
      # positives on the single-threaded browser target. Report, don't gate.
      - name: clippy (wasm, informational)
        continue-on-error: true
        run: cargo clippy -p mistlib-wasm --target wasm32-unknown-unknown --all-targets

  test:
    name: test (core + native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # The ci profile (.config/nextest.toml) retries the timing-sensitive WebRTC
      # tests so scheduling noise on shared runners doesn't redden the run.
      - run: cargo nextest run -p mistlib-core -p mistlib-native --locked --profile ci
      # nextest does not run doctests; run them separately so they can't rot silently.
      - run: cargo test -p mistlib-core -p mistlib-native --doc --locked

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: wasm-pack build --target web
        working-directory: mistlib-wasm
