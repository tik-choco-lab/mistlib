# Generated from the development repository's publish/overlay directory.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # release.sh pushes the same "release: v*" commit to develop and main, and
    # Release runs this gate on main; do not run it twice for one commit.
    if: "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release: v')"
    uses: ./.github/workflows/quality.yml
