# Pages consumes the successful Release run's verified bytes. No rebuild.
name: Pages

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: eligible
        uses: actions/github-script@v9
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.payload.workflow_run.id
            });
            core.setOutput('ready', artifacts.some(a => a.name === 'quality-receipt' && !a.expired));
      - uses: actions/checkout@v7
        if: steps.eligible.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        if: steps.eligible.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        if: steps.eligible.outputs.ready == 'true'
        with:
          pattern: candidate-*
          path: dist
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: steps.eligible.outputs.ready == 'true'
        with:
          name: quality-receipt
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: site
        if: steps.eligible.outputs.ready == 'true'
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python qa/pages.py --dist dist --receipt quality.json --commit "$RELEASE_SHA" --out site >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.site.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.deploy == 'true'
        with:
          path: site
      - id: deploy
        if: steps.site.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
