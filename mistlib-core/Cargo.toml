[package]
name = "mistlib-core"
version = "0.6.1"
edition = "2021"
license = "MPL-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = { version = "1.0", features = ["serde"] }
async-trait = "0.1"
thiserror = "2.0"
anyhow = "1.0"
bincode = "1.3"
rand = "0.8"
tracing = "0.1"
futures-util = "0.3"
sha2 = "0.10"
k256 = { version = "0.13", features = ["schnorr", "ecdh"] }
aes-gcm = "0.10"
hkdf = "0.12"
unsigned-varint = "0.8"
serde_cbor = "0.11"
tokio = { version = "1.0", default-features = false, features = ["sync"] }
web-time = "1.1.0"

[[example]]
name = "sim_run"
required-features = ["sim"]

[features]
default = []
sim = ["tokio/rt", "tokio/time", "tokio/macros", "tokio/test-util"]

[dev-dependencies]
futures = "0.3"
