[package]
name = "mistlib-native"
version = "0.8.0-beta.2"
edition = "2021"
license = "MPL-2.0"

[lib]
name = "mistlib"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
mistlib-core = { path = "../mistlib-core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
bytes = "1.0"
async-trait = "0.1"
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
futures-util = "0.3.32"
futures = "0.3"
tokio-native-tls = "0.3.1"
url = "2.5"
webrtc = "0.13.0"
sctp = { package = "webrtc-sctp", version = "0.12.0" }
rtp = "0.13.0"
rtcp = "0.13.0"
util = { package = "webrtc-util", version = "0.11.0" }
thiserror = "2.0"
anyhow = "1.0"
bincode = "1.3"
rand = "0.8"
web-time = "1.1.0"
mimalloc = "0.1"
base64 = "0.22"
# ICE+QUIC link (src/transports/ice_quic, SPEC-25). ring only, no aws-lc;
# rcgen/rustls/sha2 versions are already in the tree via webrtc-dtls.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
# Patched in the root workspace (third_party/quinn-proto) for BBRv3.
quinn-proto = { version = "0.11", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rcgen = "0.13"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
