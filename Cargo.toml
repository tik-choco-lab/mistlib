[workspace]
members = [
    "mistlib-core",
    "mistlib-native",
    "mistlib-wasm",
]
exclude = [
    "third_party/quinn-proto",
    "third_party/webrtc-dtls",
    "third_party/webrtc-ice",
    "third_party/webrtc-sctp",
]
resolver = "2"

[patch.crates-io]
quinn-proto = { path = "third_party/quinn-proto" }
webrtc-dtls = { path = "third_party/webrtc-dtls" }
webrtc-ice = { path = "third_party/webrtc-ice" }
webrtc-sctp = { path = "third_party/webrtc-sctp" }
